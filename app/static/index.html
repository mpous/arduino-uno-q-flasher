<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arduino UNO Q Flasher</title>
    <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <img
                class="brand-logo"
                src="/static/edge-impulse-logo.svg"
                alt="Edge Impulse"
            />
            <div class="brand-divider"></div>
            <h1>Arduino UNO Q Flasher<span class="subtitle">— bulk setup over ADB</span></h1>
        </div>
        <div id="health" class="health">checking...</div>
    </header>

    <section id="settings-panel" class="settings-panel" hidden>
        <div class="settings-row">
            <label>
                WiFi SSID
                <input type="text" id="setting-ssid" placeholder="MyNetwork" />
            </label>
            <label>
                WiFi password
                <input type="password" id="setting-wifi-pw" placeholder="••••••••" />
            </label>
            <label>
                Default device password (optional)
                <input type="password" id="setting-device-pw" placeholder="••••••••" />
            </label>
        </div>
        <div class="settings-row">
            <button id="save-settings-btn" class="btn btn-primary">Save</button>
            <button id="close-settings-btn" class="btn">Close</button>
            <span id="settings-status" class="muted"></span>
        </div>
    </section>

    <section class="steps">
        <div class="step" id="step-wifi" data-status="pending">
            <div class="step-header">
                <div class="step-number">1</div>
                <div class="step-title">
                    <div class="step-name">WiFi credentials</div>
                    <div class="step-state" id="step-wifi-state">not configured</div>
                </div>
            </div>
            <div class="step-body">
                <button id="open-settings-btn" class="btn">Configure</button>
            </div>
        </div>

        <div class="step-arrow">→</div>

        <div class="step" id="step-folder" data-status="optional">
            <div class="step-header">
                <div class="step-number">2</div>
                <div class="step-title">
                    <div class="step-name">App folder <span class="step-name-suffix">(optional)</span></div>
                    <div class="step-state" id="step-folder-state">none</div>
                </div>
            </div>
            <div class="step-body">
                <label class="file-picker">
                    <input type="file" id="folder-input" webkitdirectory directory multiple />
                    <span class="btn">Choose folder</span>
                </label>
                <div id="eim-info" class="eim-info" hidden>
                    <div class="eim-info-header">.eim models</div>
                    <ul id="eim-list"></ul>
                </div>
            </div>
        </div>

        <div class="step-arrow">→</div>

        <div class="step" id="step-run" data-status="pending">
            <div class="step-header">
                <div class="step-number">3</div>
                <div class="step-title">
                    <div class="step-name">Run</div>
                    <div class="step-state" id="step-run-state">0 boards ready</div>
                </div>
            </div>
            <div class="step-body">
                <div class="step-actions">
                    <button id="start-btn" class="btn btn-primary" disabled>Start all</button>
                    <button id="update-btn" class="btn btn-secondary" disabled>Update all</button>
                </div>
                <button id="refresh-btn" class="btn btn-ghost btn-small">⟳ Refresh devices</button>
                <label class="post-update-label">
                    Post-update command (runs after setup)
                    <input
                        type="text"
                        id="post-update-cmd"
                        placeholder="leave empty to skip"
                        value="app start examples:real-time-accelerometer"
                    />
                </label>
                <div id="wifi-inline-notice" class="inline-notice" hidden>
                    <span>⚠ WiFi credentials needed before running.</span>
                    <button id="wifi-inline-configure" class="btn-link">Configure</button>
                </div>
                <div id="run-status" class="muted"></div>
            </div>
        </div>
    </section>

    <section id="run-progress-bar" class="run-progress" hidden>
        <div class="run-progress-header">
            <span id="run-progress-label">Running…</span>
            <span id="run-progress-counts" class="muted">0/0</span>
        </div>
        <div class="run-progress-track">
            <div id="run-progress-fill" class="run-progress-fill"></div>
        </div>
    </section>

    <main id="devices-grid" class="devices-grid"></main>

    <template id="device-card-template">
        <div class="device-card" data-serial="">
            <div class="device-header">
                <div class="device-title">
                    <span class="device-serial"></span>
                    <span class="status-badge" data-status="idle">idle</span>
                    <span class="elapsed" hidden></span>
                </div>
                <div class="device-actions">
                    <button class="btn btn-small identify-btn" title="Blink the red LED to find this board on the bench">Identify</button>
                    <button class="btn btn-small retry-btn" hidden>Retry</button>
                </div>
            </div>
            <div class="progress-row">
                <div class="progress-bar"><div class="progress-fill"></div></div>
                <span class="current-stage">—</span>
            </div>
            <div class="skip-row">
                <label><input type="checkbox" class="skip-toggle" data-stage="change_password" /> skip password</label>
                <label><input type="checkbox" class="skip-toggle" data-stage="push_properties" /> skip properties</label>
                <label><input type="checkbox" class="skip-toggle" data-stage="post_update" /> skip post-update</label>
            </div>
            <div class="failure-reason" hidden></div>
            <div class="summary-panel" hidden>
                <div class="summary-header">Device setup summary</div>
                <div class="summary-row"><span class="label">Status</span><span class="summary-status"></span></div>
                <div class="summary-row"><span class="label">Time</span><span class="summary-time"></span></div>
                <ul class="summary-errors"></ul>
            </div>
            <pre class="log-panel"></pre>
        </div>
    </template>

    <script src="/static/app.js"></script>
</body>
</html>
